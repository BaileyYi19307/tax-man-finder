[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
# Do not pick up local Stripe/demo flags from a developer's shell by accident in docs;
# individual test modules that need demo or Stripe use @override_settings explicitly.
# Channels Selenium suite is opt-in:
#   TMF_RUN_CHANNELS_LIVE_TESTS=1 python manage.py test chats.tests.ChatTests
addopts = -q
